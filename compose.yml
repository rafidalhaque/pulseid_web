services:
  pulseid_backend:
    container_name: pulseid_backend
    image: ghcr.io/rafidalhaque/pulseid_web:master
    env_file:
      - .env
    ports:
      - 5998:5000
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pulseid_network

networks:
  pulseid_network:
    driver: bridge
    external: true